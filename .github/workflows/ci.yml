name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the locked development toolchain
        run: make setup
      - name: Lint, types, unit tests and builds
        run: make check
      - name: Fresh local stack
        run: make dev
      - name: Data-plane and platform isolation
        run: make integration
      - name: Dashboard to Control API smoke
        run: make smoke
      - name: Stop/start persistence
        run: make lifecycle
      - name: Sanitized diagnostics
        if: failure()
        run: make logs
      - name: Stop stack without deleting volumes
        if: always()
        run: make stop
  phase2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fresh control-plane stack
        run: make phase2-dev
      - name: Backend and Dashboard checks
        run: make phase2-check
      - name: Real project lifecycle, RBAC and SDK contracts
        run: make phase2-integration
      - name: Application Auth, email flows, forced RLS and signing rotation
        run: make phase3-integration
      - name: Desktop and mobile browser acceptance
        run: make phase3-e2e
      - name: No generated credentials in Git-visible files
        run: python3 scripts/check_secrets.py
      - name: Worker crash recovery without duplicate resources
        run: make phase2-recovery
      - name: Safe worker failure categories
        if: failure()
        run: docker compose -f .local/sibase-control/compose.json logs --no-color --tail 80 worker
      - name: Stop control-plane stack without deleting volumes
        if: always()
        run: make phase2-stop
